<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Animated Luxury Loader Preview | Kamat Hotels (India) Limited</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Familjen+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/khil-header.css">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #f8fafc;
        }

        /* Floating Controls Bar at top */
        .preview-controls {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000000000;
            background: rgba(17, 4, 51, 0.92);
            backdrop-filter: blur(12px);
            padding: 12px 24px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        .preview-controls span {
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .preview-btn {
            background: linear-gradient(135deg, #A00AA8 0%, #7d007d 100%);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 18px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .preview-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 14px rgba(160, 10, 168, 0.5);
            background: linear-gradient(135deg, #d4af37 0%, #A00AA8 100%);
        }

        .preview-btn.secondary {
            background: rgba(255, 255, 255, 0.12);
            color: #f1f5f9;
        }

        .preview-btn.secondary:hover {
            background: rgba(255, 255, 255, 0.22);
            box-shadow: none;
        }
    </style>
</head>
<body>

    <!-- Floating Interactive Controls -->
    <div class="preview-controls">
        <span>Classic Animated Preloader</span>
        <button class="preview-btn" onclick="replayPreloader()">Replay Animation</button>
        <button class="preview-btn secondary" onclick="toggleLoop()" id="loopBtn">Loop: ON</button>
    </div>

    <!-- The Preloader -->
    <div class="khil-preloader-wrapper loader-wrapper" id="khil-preloader" role="status" aria-live="polite" aria-label="Loading Kamat Hotels">
        <div class="khil-preloader-backdrop-effects">
            <div class="khil-preloader-orb khil-preloader-orb-1"></div>
            <div class="khil-preloader-orb khil-preloader-orb-2"></div>
        </div>
        
        <div class="khil-preloader-inner loader">
            <!-- Classic Rotating Luxury Emblem Ring System -->
            <div class="khil-preloader-crest">
                <!-- Outer slowly rotating celestial ring with classic dashed track & cardinal jewels -->
                <svg class="khil-crest-ring-outer" viewBox="0 0 200 200" aria-hidden="true">
                    <circle class="khil-ring-track" cx="100" cy="100" r="94" fill="none" stroke="rgba(160, 10, 168, 0.18)" stroke-width="1.5" stroke-dasharray="4 6" />
                    <circle class="khil-ring-solid" cx="100" cy="100" r="88" fill="none" stroke="url(#khilGoldPurpleGrad)" stroke-width="1.2" opacity="0.75" />
                    <circle cx="100" cy="6" r="3.5" fill="#D4AF37" />
                    <circle cx="194" cy="100" r="3.5" fill="#A00AA8" />
                    <circle cx="100" cy="194" r="3.5" fill="#D4AF37" />
                    <circle cx="6" cy="100" r="3.5" fill="#A00AA8" />
                    <defs>
                        <linearGradient id="khilGoldPurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#A00AA8" />
                            <stop offset="50%" stop-color="#D4AF37" />
                            <stop offset="100%" stop-color="#140253" />
                        </linearGradient>
                    </defs>
                </svg>

                <!-- Counter-rotating inner ornate sweeping arc -->
                <svg class="khil-crest-ring-inner" viewBox="0 0 160 160" aria-hidden="true">
                    <circle cx="80" cy="80" r="74" fill="none" stroke="url(#khilInnerGrad)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="140 280" />
                    <defs>
                        <linearGradient id="khilInnerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#7d007d" stop-opacity="0" />
                            <stop offset="50%" stop-color="#A00AA8" stop-opacity="1" />
                            <stop offset="100%" stop-color="#D4AF37" stop-opacity="1" />
                        </linearGradient>
                    </defs>
                </svg>

                <!-- Radial ambient soft halo -->
                <div class="khil-crest-glow"></div>

                <!-- Central Floating Official KHIL Logo Emblem -->
                <div class="khil-preloader-logo">
                    <img src="assets/images/logo-2.png" alt="Kamat Hotels (India) Limited Logo">
                </div>
            </div>

            <!-- Classic Brand Typography & Heritage Ribbon -->
            <div class="khil-preloader-brand">
                <span class="khil-preloader-title">KAMAT HOTELS</span>
                <span class="khil-preloader-corp">(INDIA) LIMITED</span>
                
                <div class="khil-preloader-divider">
                    <span class="khil-divider-line"></span>
                    <span class="khil-divider-icon">◆</span>
                    <span class="khil-divider-line"></span>
                </div>
                
                <span class="khil-preloader-sub">SINCE 1986 • ASIA'S PIONEERING HOSPITALITY</span>
            </div>

            <!-- Classic Animated Luxury Progress Track & Live Percentage -->
            <div class="khil-preloader-meter">
                <div class="khil-preloader-progress-track">
                    <div class="khil-preloader-progress-bar" id="khil-preloader-bar">
                        <span class="khil-progress-sparkle"></span>
                    </div>
                </div>
                <div class="khil-preloader-status-row">
                    <span class="khil-preloader-status-text" id="khil-preloader-status">Curating bespoke hospitality...</span>
                    <span class="khil-preloader-counter" id="khil-preloader-percent">0%</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        var isLooping = true;
        var progress = 0;
        var interval = null;

        var phrases = [
            "Curating bespoke hospitality...",
            "Preserving heritage & luxury...",
            "Asia's pioneering hospitality chain...",
            "Welcoming you to Kamat Hotels..."
        ];

        function startAnimation() {
            var preloader = document.getElementById('khil-preloader');
            var bar = document.getElementById('khil-preloader-bar');
            var percent = document.getElementById('khil-preloader-percent');
            var status = document.getElementById('khil-preloader-status');

            preloader.classList.remove('khil-preloader-fade');
            preloader.style.display = 'flex';
            preloader.style.opacity = '1';
            preloader.style.visibility = 'visible';

            progress = 0;
            if (interval) clearInterval(interval);

            interval = setInterval(function() {
                progress += 1.5;
                if (progress > 100) progress = 100;

                bar.style.width = progress + '%';
                percent.textContent = Math.round(progress) + '%';

                if (progress < 30) status.textContent = phrases[0];
                else if (progress < 65) status.textContent = phrases[1];
                else if (progress < 92) status.textContent = phrases[2];
                else status.textContent = phrases[3];

                if (progress >= 100) {
                    clearInterval(interval);
                    if (isLooping) {
                        setTimeout(function() {
                            preloader.classList.add('khil-preloader-fade');
                            setTimeout(function() {
                                startAnimation();
                            }, 1200);
                        }, 700);
                    }
                }
            }, 35);
        }

        function replayPreloader() {
            startAnimation();
        }

        function toggleLoop() {
            isLooping = !isLooping;
            document.getElementById('loopBtn').textContent = isLooping ? 'Loop: ON' : 'Loop: OFF';
            if (isLooping && progress >= 100) {
                startAnimation();
            }
        }

        window.addEventListener('DOMContentLoaded', startAnimation);
    </script>
</body>
</html>
