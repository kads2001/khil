<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Section Preview</title>
    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="assets/css/plugins/fontawesome.css">
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <style>
        body {
            margin: 0;
            padding: 40px 0;
            background: #ffffff;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            color: #111827;
        }

        /* ==========================================================================
           KHIL GALLERY SECTION (Matching User Reference Image 1:1)
           ========================================================================== */
        .khil-gallery-section {
            position: relative;
            background: #ffffff;
            padding: 85px 0 100px;
            overflow: hidden;
        }

        .khil-gallery-container {
            max-width: 1260px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Header Area (Matching Reference Layout) */
        .khil-gallery-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 36px;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }

        .khil-gallery-title {
            font-size: clamp(34px, 4vw, 48px);
            font-weight: 400; /* Clean, light-to-regular weight matching reference */
            line-height: 1.15;
            letter-spacing: -0.025em;
            color: #111827;
            margin: 0;
            max-width: 580px;
        }

        .khil-gallery-header-right {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            max-width: 390px;
            padding-bottom: 6px;
        }

        .khil-gallery-desc {
            font-size: 14px;
            line-height: 1.6;
            color: #64748b;
            margin: 0 0 12px;
            font-weight: 400;
        }

        .khil-gallery-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 500;
            color: #111827;
        }

        .khil-gallery-status .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #0284c7; /* Vibrant blue bullet matching reference */
        }

        /* 3-Column Triptych Grid Matching Reference Image */
        .khil-gallery-grid {
            display: grid;
            grid-template-columns: 1fr 1.35fr 1fr;
            gap: 32px;
            align-items: center; /* Vertically centers Left & Right alongside Center */
        }

        .khil-gallery-item {
            position: relative;
            border-radius: 24px;
            overflow: hidden;
            background: #f1f5f9;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .khil-gallery-item:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.12);
        }

        /* Left Image: Medium Squarish / Landscape */
        .khil-gallery-item.item-left {
            height: 360px;
            border-radius: 22px;
        }

        /* Center Image: Tall Hero Portrait */
        .khil-gallery-item.item-center {
            height: 530px;
            border-radius: 26px;
        }

        /* Right Image: Medium Squarish / Landscape */
        .khil-gallery-item.item-right {
            height: 330px;
            border-radius: 22px;
        }

        .khil-gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .khil-gallery-item:hover img {
            transform: scale(1.05);
        }

        .item-center img {
            object-position: center top;
        }

        /* Floating property tag on hover */
        .gallery-tag-overlay {
            position: absolute;
            bottom: 16px;
            left: 16px;
            padding: 6px 14px;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #ffffff;
            font-size: 12px;
            font-weight: 600;
            border-radius: 999px;
            opacity: 0;
            transform: translateY(6px);
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .khil-gallery-item:hover .gallery-tag-overlay {
            opacity: 1;
            transform: translateY(0);
        }

        /* Responsive Breakpoints */
        @media only screen and (max-width: 991px) {
            .khil-gallery-section {
                padding: 70px 0 80px;
            }
            .khil-gallery-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 18px;
                margin-bottom: 36px;
            }
            .khil-gallery-grid {
                grid-template-columns: 1fr;
                gap: 24px;
            }
            .khil-gallery-item.item-left,
            .khil-gallery-item.item-center,
            .khil-gallery-item.item-right {
                height: 320px;
            }
        }

        @media only screen and (max-width: 575px) {
            .khil-gallery-section {
                padding: 55px 0 65px;
            }
            .khil-gallery-title {
                font-size: 28px;
            }
            .khil-gallery-item.item-left,
            .khil-gallery-item.item-center,
            .khil-gallery-item.item-right {
                height: 240px;
                border-radius: 18px;
            }
        }
    </style>
</head>
<body>

    <!-- ==========================================================================
         KHIL GALLERY SECTION (Matching User Reference Image 1:1)
         ========================================================================== -->
    <section class="khil-gallery-section" id="gallery" aria-labelledby="gallery-title">
        <div class="khil-gallery-container">
            <!-- Header Area -->
            <div class="khil-gallery-header">
                <h2 class="khil-gallery-title" id="gallery-title">
                    Hospitality to elevate your<br>journey forward
                </h2>
                <div class="khil-gallery-header-right">
                    <p class="khil-gallery-desc">
                        Curating iconic eco-conscious luxury, historic fortresses, and royal heritage beach retreats across India.
                    </p>
                    <div class="khil-gallery-status">
                        <span class="status-dot"></span>
                        <span>exploring five signature hotel brands</span>
                    </div>
                </div>
            </div>

            <!-- 3-Column Triptych Grid -->
            <div class="khil-gallery-grid">
                <!-- Left Image: The Orchid Hotel, Mumbai (Architectural Atrium & Waterfall) -->
                <div class="khil-gallery-item item-left">
                    <img src="assets/img/orchidmumbai.jpg" alt="The Orchid Hotel, Mumbai - 5-Star Ecotel Atrium" loading="lazy">
                    <span class="gallery-tag-overlay">The Orchid Hotel, Mumbai</span>
                </div>

                <!-- Center Image: Fort JadhavGADH, Pune (Tall Hero Heritage Fortress) -->
                <div class="khil-gallery-item item-center">
                    <img src="assets/img/img-4.webp" alt="Fort JadhavGADH, Pune - 300-Yr Heritage Fort Resort" loading="lazy">
                    <span class="gallery-tag-overlay">Fort JadhavGADH, Pune</span>
                </div>

                <!-- Right Image: Lotus Eco Resort, Konark (Coastal Nature & River Retreat) -->
                <div class="khil-gallery-item item-right">
                    <img src="assets/img/about07.jpeg" alt="Lotus Eco Resort, Konark - Pristine Beach & Nature Getaway" loading="lazy">
                    <span class="gallery-tag-overlay">Lotus Eco Resort, Konark</span>
                </div>
            </div>
        </div>
    </section>

</body>
</html>
